- name: 📅 Isometric commit calendar - Half-year calendar
  uses: lowlighter/metrics@latest
  with:
    token: MOCKED_TOKEN
    plugin_isocalendar: 'yes'
    use_mocked_data: 'yes'
    verify: 'yes'
- name: 📅 Isometric commit calendar - Full-year calendar
  uses: lowlighter/metrics@latest
  with:
    token: MOCKED_TOKEN
    plugin_isocalendar: 'yes'
    plugin_isocalendar_duration: full-year
    use_mocked_data: 'yes'
    verify: 'yes'
- name: 📅 Isometric commit calendar - Multiple accounts
  uses: lowlighter/metrics@latest
  with:
    token: |
      MOCKED_TOKEN
      MOCKED_TOKEN_WORK
    base: header, activity, community, repositories
    plugin_isocalendar: 'yes'
    plugin_languages: 'yes'
    plugin_followup: 'yes'
    plugin_lines: 'yes'
    plugin_calendar: 'yes'
    use_mocked_data: 'yes'
    verify: 'yes'
  modes:
    - action
- name: 📅 Isometric commit calendar - Multiple accounts with user ignored
  uses: lowlighter/metrics@latest
  with:
    user: octocat
    token: |
      MOCKED_TOKEN
      MOCKED_TOKEN_WORK
    base: header, activity, community, repositories
    plugin_isocalendar: 'yes'
    plugin_languages: 'yes'
    plugin_followup: 'yes'
    plugin_lines: 'yes'
    plugin_calendar: 'yes'
    plugin_activity: 'yes'
    plugin_habits: 'yes'
    use_mocked_data: 'yes'
    verify: 'yes'
  modes:
    - action
